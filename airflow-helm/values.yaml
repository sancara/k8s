executor: LocalExecutor
fernetKey: 123abc # replace this with a base64-encoded 32-byte key for production

web:
  service:
    type: NodePort
    nodePort:
      http: 30080

airflow:
  users:
    - username: admin
      password: admin
      role: Admin
      email: admin@example.com
      firstName: Admin
      lastName: User

  config:
    core:
      load_examples: "False"

logs:
  persistence:
    enabled: false

postgresql:
  enabled: true

redis:
  enabled: true

flower:
  enabled: false

triggerer:
  enabled: false

dags:
  gitSync:
    enabled: true
    repo: "git@github.com:murilommen/airflow-muri.git"
    branch: main
    subPath: "dags"
    depth: 1
    sshKeySecret: airflow-ssh-secret


extraSecrets:
  airflow-ssh-secret:
    # this should not be commited to github
    data: |
      gitSshKey: base64 encoded private ssh key without passphrase
